[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-coding-agent"
version = "0.1.0"
description = "Skill-based coding agent with repository RAG and controlled MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - academic prototype" }
authors = [{ name = "Agentic-AI contributors" }]
dependencies = []

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["coding_agent"]

[tool.coverage.report]
show_missing = true
fail_under = 0
